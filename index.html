<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Prioritarias — Replanteos Málaga</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#122236;
    --navy-2:#1a3049;
    --paper:#eef1ee;
    --panel:#ffffff;
    --line:#d7ddd7;
    --ink:#182028;
    --ink-soft:#5b6570;
    --orange:#d95a1e;
    --blue:#2e6fa8;
    --green:#1f7a5c;
    --gray:#8a92a0;
    --grid:#24405c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Archivo',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- HEADER ---------- */
  header{
    background:
      linear-gradient(var(--navy),var(--navy)),
      repeating-linear-gradient(0deg, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 28px);
    background-blend-mode:normal, soft-light, soft-light;
    color:#fff;
    padding:18px 22px 16px;
    border-bottom:3px solid var(--orange);
  }
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;}
  h1{
    font-size:20px;
    margin:0 0 3px;
    font-weight:800;
    letter-spacing:.2px;
  }
  .subtitle{
    font-size:12.5px;
    color:#aebccb;
    font-family:'IBM Plex Mono',monospace;
    margin:0;
  }
  .tech-field{display:flex;flex-direction:column;gap:4px;}
  .tech-field label{font-size:11px;color:#9fb0c2;font-family:'IBM Plex Mono',monospace;}
  .tech-field input{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:7px 10px;
    border-radius:3px;
    font-family:'Archivo',sans-serif;
    font-size:13.5px;
    min-width:180px;
  }
  .tech-field input::placeholder{color:#8296ab;}

  .stats-bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .stat-chip{
    display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18);
    padding:6px 12px;border-radius:3px;
    font-size:12.5px;
  }
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .stat-chip b{font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* ---------- MAP ---------- */
  #map-wrap{position:relative;}
  #map{height:52vh;min-height:340px;width:100%;}
  .map-search{
    position:absolute;top:10px;left:10px;z-index:500;
    display:flex;gap:6px;width:300px;
  }
  .map-search input{
    width:210px;flex:none;padding:8px 10px;border:1px solid var(--line);border-radius:3px;
    font-family:'Archivo',sans-serif;font-size:13px;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .map-search button{
    flex:none;background:var(--navy);color:#fff;border:none;padding:8px 14px;
    border-radius:3px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .map-search button:hover{background:var(--navy-2);}
  .locate-fab{
    position:absolute;bottom:16px;right:16px;z-index:500;
    width:48px;height:48px;border-radius:50%;
    background:#fff;border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    font-size:19px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .locate-fab:hover{background:var(--paper);}
  .locate-fab.locating{animation:pulse 1s infinite;}
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.5;}
  }

  /* ---------- PANEL ---------- */
  #panel{flex:1;padding:16px 20px 60px;max-width:1180px;width:100%;margin:0 auto;}
  .filters{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    margin-bottom:14px;
  }
  .filters input, .filters select{
    padding:8px 10px;border:1px solid var(--line);border-radius:3px;
    font-family:'Archivo',sans-serif;font-size:13px;background:#fff;color:var(--ink);
  }
  .filters input[type=text]{flex:1;min-width:160px;}
  .export-btn{
    margin-left:auto;
    background:var(--navy);color:#fff;border:none;
    padding:9px 16px;border-radius:3px;font-weight:600;font-size:13px;
    cursor:pointer;
  }
  .export-btn:hover{background:var(--navy-2);}
  .date-filter-label{
    display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .date-filter-label input{
    padding:7px 8px;border:1px solid var(--line);border-radius:3px;font-size:13px;
  }
  .btn-secondary-flat{
    border:1px solid var(--line);background:#fff;border-radius:3px;
    padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft);
  }
  .btn-secondary-flat:hover{border-color:var(--navy);color:var(--navy);}
  .count-line{font-size:12px;color:var(--ink-soft);margin:0 0 10px;font-family:'IBM Plex Mono',monospace;}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);}
  thead th{
    text-align:left;font-size:11.5px;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;font-weight:500;
    padding:9px 10px;border-bottom:1px solid var(--line);
    background:#f6f7f5;
  }
  tbody td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
  tbody tr:hover{background:#f7faf8;cursor:pointer;}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:2px;
    font-size:11px;font-family:'IBM Plex Mono',monospace;color:#fff;
  }
  .obs-cell{max-width:220px;color:var(--ink-soft);}
  .row-actions{display:flex;gap:8px;}
  .row-actions button{
    border:1px solid var(--line);background:#fff;border-radius:3px;
    padding:4px 8px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);
  }
  .row-actions button:hover{border-color:var(--navy);color:var(--navy);}
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
    font-size:13.5px;border:1px dashed var(--line);background:#fff;
  }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,18,28,.55);
    display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;width:100%;max-width:480px;max-height:88vh;overflow:auto;
    border-radius:5px;border-top:4px solid var(--orange);
  }
  .modal-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);}
  .modal-head h2{margin:0 0 4px;font-size:16px;}
  .modal-head p{margin:0;font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;
    font-family:'Archivo',sans-serif;font-size:13.5px;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .geo-status{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .modal-actions{
    padding:14px 20px;border-top:1px solid var(--line);
    display:flex;justify-content:flex-end;gap:10px;
  }
  .btn-secondary{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:3px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .btn-primary{background:var(--orange);border:none;color:#fff;padding:9px 18px;border-radius:3px;cursor:pointer;font-size:13px;font-weight:700;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-danger{background:#fff;border:1px solid #d64545;color:#d64545;padding:9px 14px;border-radius:3px;cursor:pointer;font-size:12.5px;font-weight:600;margin-right:auto;}

  .leaflet-popup-content{font-family:'Archivo',sans-serif;font-size:13px;min-width:190px;}
  .popup-title{font-weight:700;margin-bottom:2px;}
  .popup-meta{color:var(--ink-soft);font-size:11.5px;font-family:'IBM Plex Mono',monospace;margin-bottom:8px;}
  .popup-select{width:100%;padding:5px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;font-size:12.5px;}
  .popup-actions{display:flex;gap:6px;}
  .popup-actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:3px;padding:5px;font-size:11.5px;cursor:pointer;}

  @media(max-width:640px){
    #map{height:44vh;}
    .field-row{flex-direction:column;}
    thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{border:1px solid var(--line);margin-bottom:10px;border-radius:4px;}
    tbody td{border-bottom:none;padding:6px 12px;}
    tbody td:first-child{padding-top:10px;font-weight:700;}
    tbody td:last-child{padding-bottom:10px;}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="head-row">
      <div>
        <h1>Control de Prioritarias</h1>
        <p class="subtitle">Mapa creado por Juan José Porras para el equipo técnico de replanteos de DIGI.</p>
      </div>
      <div class="tech-field">
        <label for="tech-name-input">TÉCNICO</label>
        <input id="tech-name-input" type="text" placeholder="Tu nombre">
      </div>
    </div>
    <div class="stats-bar" id="stats-bar"></div>
  </header>

  <div id="map-wrap">
    <div class="map-search">
      <input type="text" id="map-search-input" placeholder="Buscar dirección o coordenadas (36.50, -4.75)...">
      <button id="map-search-btn">Buscar</button>
    </div>
    <button class="locate-fab" id="locate-btn" title="Mi ubicación" aria-label="Mi ubicación">📍</button>
    <div id="map"></div>
  </div>

  <div id="panel">
    <div class="filters">
      <input type="text" id="f-search" placeholder="Buscar por dirección o población...">
      <select id="f-poblacion"><option value="">Población: todas</option></select>
      <select id="f-tecnico"><option value="">Técnico: todos</option></select>
      <select id="f-estado">
        <option value="">Estado: todos</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="EN ESTUDIO">En estudio</option>
        <option value="TERMINADO">Terminado / cobertura</option>
        <option value="DESCARTADA">Sin permiso</option>
      </select>
      <label class="date-filter-label">Día:
        <input type="date" id="f-fecha">
      </label>
      <button class="btn-secondary-flat" id="f-fecha-clear" title="Quitar filtro de día">✕</button>
      <button class="btn-secondary-flat" id="import-btn" title="Importar obras desde un archivo Excel">Importar desde Excel</button>
      <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none;">
      <button class="export-btn" id="export-btn">Exportar a Excel</button>
    </div>
    <p class="count-line" id="count-line"></p>
    <div id="table-wrap"></div>
  </div>

</div>

<!-- MODAL: nueva / editar obra -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Nueva obra</h2>
      <p id="modal-coords" class="mono"></p>
    </div>
    <div class="modal-body">
      <p class="geo-status" id="geo-status"></p>
      <div class="field-row">
        <div class="field">
          <label>Población</label>
          <input type="text" id="f-input-poblacion">
        </div>
        <div class="field">
          <label>% Construcción</label>
          <input type="number" id="f-input-pct" min="0" max="100" placeholder="0–100">
        </div>
      </div>
      <div class="field">
        <label>GESCAL26</label>
        <input type="text" id="f-input-gescal26" placeholder="Código interno">
      </div>
      <div class="field">
        <label>Dirección</label>
        <input type="text" id="f-input-direccion">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Técnico</label>
          <input type="text" id="f-input-tecnico">
        </div>
        <div class="field">
          <label>Estado</label>
          <select id="f-input-estado">
            <option value="PENDIENTE">Pendiente</option>
            <option value="EN ESTUDIO">En estudio</option>
            <option value="TERMINADO">Terminado / cobertura</option>
            <option value="DESCARTADA">Sin permiso</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Promotor</label>
          <input type="text" id="f-input-promotor">
        </div>
        <div class="field">
          <label>Contacto</label>
          <input type="text" id="f-input-contacto">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Fecha próximo replanteo</label>
          <input type="date" id="f-input-fecha-replanteo">
        </div>
        <div class="field">
          <label>Entrega de llaves</label>
          <input type="text" id="f-input-entrega-llaves" placeholder="Fecha, NA, NO DISPONIBLE...">
        </div>
      </div>
      <div class="field">
        <label>Fecha de última visita</label>
        <input type="date" id="f-input-fecha-visita">
      </div>
      <div class="field">
        <label>Observaciones</label>
        <textarea id="f-input-obs"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="delete-btn" style="display:none;">Eliminar</button>
      <button class="btn-secondary" id="cancel-btn">Cancelar</button>
      <button class="btn-primary" id="save-btn">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";

  // ============================================================
  // CONFIGURACIÓN DE FIREBASE
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB1UFR3p2JuZeZXwpqZ6Ie2JMxJMWCJ-mE",
    authDomain: "prioritarias-malaga.firebaseapp.com",
    projectId: "prioritarias-malaga",
    storageBucket: "prioritarias-malaga.firebasestorage.app",
    messagingSenderId: "356289109873",
    appId: "1:356289109873:web:1a0738635cd38b3aa020d0"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const obrasCollection = db.collection('obras');

  const ESTADO_COLOR = {
    "PENDIENTE":"#d95a1e",
    "EN ESTUDIO":"#2e6fa8",
    "TERMINADO":"#1f7a5c",
    "DESCARTADA":"#8a92a0"
  };

  const ESTADO_LABEL = {
    "PENDIENTE":"Pendiente",
    "EN ESTUDIO":"En estudio",
    "TERMINADO":"Terminado",
    "DESCARTADA":"Sin permiso"
  };

  let obras = [];
  let markersById = {};
  let pendingLatLng = null;
  let editingId = null;
  let techName = "";

  const $ = (id) => document.getElementById(id);

  // ---------- MAP ----------
  const map = L.map('map', {zoomControl:false}).setView([36.62, -4.75], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  map.on('click', (e) => openModal(e.latlng, null));

  // ---------- BUSCADOR ----------
  let searchMarker = null;

  async function buscarUbicacion(){
    const raw = $('map-search-input').value.trim();
    if(!raw) return;

    const btn = $('map-search-btn');
    const original = btn.textContent;

    const coordMatch = raw.match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);

    if(coordMatch){
      const lat = parseFloat(coordMatch[1]);
      const lon = parseFloat(coordMatch[2]);

      map.setView([lat, lon], 17);

      if(searchMarker) map.removeLayer(searchMarker);

      searchMarker = L.circleMarker([lat, lon], {
        radius:9,
        color:'#fff',
        weight:3,
        fillColor:'#d95a1e',
        fillOpacity:1
      }).addTo(map).bindPopup("Ubicación buscada").openPopup();

      return;
    }

    btn.disabled = true;
    btn.textContent = "Buscando...";

    try{
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6000);

      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(raw)}&limit=1&countrycodes=es`;

      const res = await fetch(url, {
        headers:{'Accept-Language':'es'},
        signal: controller.signal
      });

      clearTimeout(timeout);

      const data = await res.json();

      if(data && data[0]){
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);

        map.setView([lat, lon], 17);

        if(searchMarker) map.removeLayer(searchMarker);

        searchMarker = L.circleMarker([lat, lon], {
          radius:9,
          color:'#fff',
          weight:3,
          fillColor:'#d95a1e',
          fillOpacity:1
        }).addTo(map).bindPopup(data[0].display_name).openPopup();
      }else{
        alert("No se ha encontrado esa dirección. Prueba a ser más concreto (calle, número, población) o escribe las coordenadas directamente (ej: 36.50, -4.75).");
      }
    }catch(e){
      alert("No se pudo buscar esa dirección en este momento. Prueba con coordenadas (ej: 36.50, -4.75) o inténtalo de nuevo.");
    }finally{
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  $('map-search-btn').addEventListener('click', buscarUbicacion);

  $('map-search-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') buscarUbicacion();
  });

  // ---------- STORAGE ----------
  function loadTechName(){
    const stored = localStorage.getItem('technician-name');

    if(stored){
      techName = stored;
      $('tech-name-input').value = techName;
    }
  }

  function saveTechName(name){
    techName = name;
    localStorage.setItem('technician-name', name);
  }

  function startRealtimeSync(){
    obrasCollection.onSnapshot((snapshot) => {
      obras = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a,b) => (b.creado||"").localeCompare(a.creado||""));

      renderAll();

    }, (err) => {
      console.error("Error de sincronización con Firebase", err);
      alert("No se pudo conectar con la base de datos compartida. Revisa la configuración de Firebase (firebaseConfig) en el código.");
    });
  }

  async function saveObra(obra){
    try{
      await obrasCollection.doc(obra.id).set(obra);
      return true;
    }catch(e){
      console.error(e);
      alert("Error guardando la obra. Revisa tu conexión o las reglas de Firestore.");
      return false;
    }
  }

  async function deleteObraById(id){
    try{
      await obrasCollection.doc(id).delete();
      return true;
    }catch(e){
      console.error(e);
      return false;
    }
  }

  // ---------- REVERSE GEOCODE ----------
  async function reverseGeocode(lat, lon){
    try{
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 4000);

      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;

      const res = await fetch(url, {
        headers: { 'Accept-Language': 'es' },
        signal: controller.signal
      });

      clearTimeout(timeout);

      if(!res.ok) throw new Error("geocode failed");

      const data = await res.json();
      const a = data.address || {};

      const calle = a.road || a.pedestrian || a.footway || "";
      const numero = a.house_number || "";
      const poblacion = a.town || a.village || a.city || a.municipality || "";
      const direccion = [calle, numero].filter(Boolean).join(" ");

      return {
        direccion: direccion || data.display_name || "",
        poblacion
      };

    }catch(e){
      return null;
    }
  }

  // ---------- MODAL ----------
  function resetForm(){
    $('f-input-poblacion').value = "";
    $('f-input-pct').value = "";
    $('f-input-gescal26').value = "";
    $('f-input-direccion').value = "";
    $('f-input-tecnico').value = techName || "";
    $('f-input-estado').value = "PENDIENTE";
    $('f-input-promotor').value = "";
    $('f-input-contacto').value = "";
    $('f-input-fecha-replanteo').value = "";
    $('f-input-entrega-llaves').value = "";
    $('f-input-fecha-visita').value = new Date().toISOString().slice(0,10);
    $('f-input-obs').value = "";
  }

  async function openModal(latlng, existing){
    editingId = existing ? existing.id : null;
    pendingLatLng = latlng;

    resetForm();

    $('delete-btn').style.display = existing ? '' : 'none';
    $('modal-title').textContent = existing ? "Editar obra" : "Nueva obra";
    $('modal-coords').textContent = `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;

        '"':'&quot;',
        "'":'&#39;'

  // ---------- IMPORT ----------
  function excelDateToISO(value){
    if(value == null || value === "") return "";

    if(value instanceof Date && !isNaN(value.getTime())){
      return value.toISOString().slice(0,10);
    }

    if(typeof value === "number"){
      const utc = new Date(Date.UTC(1899, 11, 30) + value * 86400000);

      return isNaN(utc.getTime())
        ? ""
        : utc.toISOString().slice(0,10);
    }

    const text = String(value).trim();

    let m = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);

    if(m){
      const d = m[1].padStart(2,'0');
      const mo = m[2].padStart(2,'0');
      const y = m[3];

      return `${y}-${mo}-${d}`;
    }

    m = text.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);

    if(m){
      return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    }

    return "";
  }

  function parseCoords(value){
    if(value == null) return null;

    const text = String(value).trim().replace(/;/g, ',');
    const m = text.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);

    if(!m) return null;

    const lat = Number(m[1]);
    const lon = Number(m[2]);

    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lon) ||
      Math.abs(lat) > 90 ||
      Math.abs(lon) > 180
    ) return null;

    return {lat, lon};
  }

  function normalizeEstado(value){
    const v = String(value == null ? "" : value).trim().toUpperCase();

    if(v === "SIN PERMISO" || v === "DESCARTADA") return "DESCARTADA";
    if(v === "TERMINADO" || v === "TERMINADA" || v === "COBERTURA") return "TERMINADO";
    if(v === "EN ESTUDIO") return "EN ESTUDIO";

    return "PENDIENTE";
  }

  function normalizePct(value){
    if(value == null || value === "") return null;

    if(typeof value === "number"){
      return value <= 1 ? value * 100 : value;
    }

    const n = parseFloat(
      String(value)
        .replace('%','')
        .replace(',','.')
        .trim()
    );

    return Number.isFinite(n) ? n : null;
  }

  function normalizeHeader(value){
    return String(value == null ? "" : value)
      .trim()
      .toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");
  }

  async function importFromExcel(file){
    const data = await file.arrayBuffer();

    const wb = XLSX.read(data, {
      type:"array",
      cellDates:true
    });

    const sheetName =
      wb.SheetNames.includes("OBRAS DETECTADAS")
        ? "OBRAS DETECTADAS"
        : wb.SheetNames[0];

    const ws = wb.Sheets[sheetName];

    const rawRows = XLSX.utils.sheet_to_json(ws, {
      defval:""
    });

    if(!rawRows.length){
      throw new Error("El archivo no contiene filas de datos.");
    }

    const rows = rawRows.map((row, index) => {
      const normalized = {
        __filaExcel: index + 2
      };

      Object.keys(row).forEach(k => {
        normalized[normalizeHeader(k)] = row[k];
      });

      return normalized;
    });

    let imported = 0;
    let updated = 0;
    let skipped = 0;

    const errors = [];
    const refused = [];

    for(const row of rows){
      const fila = row.__filaExcel;

      const gescal26 =
        String(row["GESCAL26"] || "").trim();

      const direccion =
        String(row["DIRECCION"] || "").trim();

      const poblacion =
        String(row["POBLACION"] || "").trim();

      const identificador =
        gescal26 || direccion || `fila ${fila}`;

      try{
        const coords =
          parseCoords(row["LINK DE GOOGLE"]);

        if(!direccion && !coords){
          skipped++;

          errors.push(
            `Fila ${fila} (${identificador}): no tiene dirección ni coordenadas válidas.`
          );

          continue;
        }

        if(!coords){
          skipped++;

          errors.push(
            `Fila ${fila} (${identificador}): no tiene coordenadas válidas en "LINK DE GOOGLE".`
          );

          continue;
        }

        // Comprobación de duplicados:
        // GESCAL26 O dirección.
        // Se ignoran mayúsculas/minúsculas y espacios repetidos.
        const normalizarTexto = (valor) =>
          String(valor || "")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ");

        const gescalNormalizado =
          normalizarTexto(gescal26);

        const direccionNormalizada =
          normalizarTexto(direccion);

        const existing = obras.find(o => {
          const mismoGescal =
            gescalNormalizado &&
            normalizarTexto(o.gescal26) === gescalNormalizado;

          const mismaDireccion =
            direccionNormalizada &&
            normalizarTexto(o.direccion) === direccionNormalizada;

          return mismoGescal || mismaDireccion;
        });

        if(existing){
          const coincideGescal =
            gescalNormalizado &&
            normalizarTexto(existing.gescal26) === gescalNormalizado;

          const coincideDireccion =
            direccionNormalizada &&
            normalizarTexto(existing.direccion) === direccionNormalizada;

          const motivo =
            coincideGescal && coincideDireccion
              ? `GESCAL26 ${gescal26} y dirección "${direccion}"`
              : coincideGescal
                ? `GESCAL26 ${gescal26}`
                : `dirección "${direccion}"`;

          const wantsImport = confirm(
            `Esta Prioritaria ya existe en la aplicación.\n\n` +
            `Coincidencia encontrada por: ${motivo}\n\n` +
            `Existente:\n` +
            `${existing.direccion || "Sin dirección"}` +
            `${existing.gescal26 ? `\nGESCAL26: ${existing.gescal26}` : ""}\n\n` +
            `Prioritaria del Excel:\n` +
            `${direccion}` +
            `${poblacion ? ` (${poblacion})` : ""}` +
            `${gescal26 ? `\nGESCAL26: ${gescal26}` : ""}\n\n` +
            `¿Quieres COPIAR esta Prioritaria como una nueva o DESCARTARla?\n\n` +
            `Aceptar = COPIAR\nCancelar = DESCARTAR`
          );

          if(!wantsImport){
            refused.push(
              `Fila ${fila} — ${gescal26 || direccion}`
            );

            continue;
          }
        }

        const now = new Date();

        const obra = {
          // IMPORTANTE:
          // siempre se genera un ID nuevo.
          // Por tanto, al elegir COPIAR nunca se modifica
          // la Prioritaria existente.
          id: ('o' + Date.now() + Math.random().toString(36).slice(2,8)),

          lat: coords.lat,
          lon: coords.lon,

          poblacion,
          direccion,

          pct: normalizePct(row["% CONSTRUCCION"]),

          gescal26,

          tecnico:
            String(row["TECNICO/S"] || "").trim(),

          estado:
            normalizeEstado(row["ESTADO"]),

          promotor:
            String(row["PROMOTOR"] || "").trim(),

          contacto:
            String(row["CONTACTO"] || "").trim(),

          fechaReplanteo:
            excelDateToISO(row["FECHA PROXIMO REPLANTEO"]),

          entregaLlaves:
            String(row["ENTREGA DE LLAVES"] || "").trim(),

          fechaVisita:
            excelDateToISO(row["FECHA DE ULTIMA VISITA"]),

          observaciones:
            String(row["OBSERVACIONES"] || "").trim(),

          creado:
            now.toISOString()
        };

        const ok = await saveObra(obra);

        if(!ok){
          throw new Error(
            "Firestore no ha podido guardar la obra."
          );
        }

        // Siempre es una nueva obra.
        imported++;

        const idx =
          obras.findIndex(o => o.id === obra.id);

        if(idx >= 0)
          obras[idx] = obra;
        else
          obras.unshift(obra);

      }catch(err){
        console.error(
          `Error en fila ${fila}`,
          err
        );

        errors.push(
          `Fila ${fila} (${identificador}): ${err.message || "error desconocido"}`
        );
      }
    }

    renderAll();

    let resumen =
      `Importación terminada.\n\n` +
      `✅ Nuevas importadas: ${imported}\n` +
      `⏭️ Descartadas por el usuario: ${refused.length}\n` +
      `❌ Con error/omitidas: ${errors.length}`;

    if(refused.length){
      resumen +=
        `\n\n⏭️ DESCARTADAS:\n- ${refused.join("\n- ")}`;
    }

    if(errors.length){
      resumen +=
        `\n\n❌ ERRORES:\n- ${errors.join("\n- ")}`;
    }

    alert(resumen);
  }

  let userLocationMarker = null;

  $('locate-btn').addEventListener('click', () => {
    if(!navigator.geolocation){
      alert(
        "Este entorno no permite acceder a la ubicación del navegador. " +
        "Marca el punto directamente tocando el mapa donde estés."
      );

      return;
    }

    const btn = $('locate-btn');

    btn.classList.add('locating');

    const timeout = setTimeout(() => {
      btn.classList.remove('locating');

      alert(
        "No se ha podido obtener tu ubicación en este entorno " +
        "(puede estar bloqueada por permisos). Marca el punto directamente tocando el mapa donde estés."
      );
    }, 6000);

    try{
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          clearTimeout(timeout);

          btn.classList.remove('locating');

          const {
            latitude,
            longitude
          } = pos.coords;

          map.setView(
            [latitude, longitude],
            16
          );

          if(userLocationMarker)
            map.removeLayer(userLocationMarker);

          userLocationMarker =
            L.circleMarker(
              [latitude, longitude],
              {
                radius:9,
                color:'#fff',
                weight:3,
                fillColor:'#2e6fa8',
                fillOpacity:1
              }
            )
            .addTo(map)
            .bindPopup("Tu ubicación actual")
            .openPopup();
        },

        (err) => {
          clearTimeout(timeout);

          btn.classList.remove('locating');

          let msg =
            "No se pudo obtener tu ubicación. " +
            "Marca el punto directamente tocando el mapa donde estés.";

          if(err.code === err.PERMISSION_DENIED){
            msg =
              "Este entorno ha bloqueado el permiso de ubicación. " +
              "Marca el punto directamente tocando el mapa donde estés.";
          }

          alert(msg);
        },

        {
          enableHighAccuracy:true,
          timeout:5500
        }
      );

    }catch(e){
      clearTimeout(timeout);

      btn.classList.remove('locating');

      alert(
        "La ubicación no está disponible en este entorno. " +
        "Marca el punto directamente tocando el mapa donde estés."
      );
    }
  });

  const MESES_ES = [
    'ENERO',
    'FEBRERO',
    'MARZO',
    'ABRIL',
    'MAYO',
    'JUNIO',
    'JULIO',
    'AGOSTO',
    'SEPTIEMBRE',
    'OCTUBRE',
    'NOVIEMBRE',
    'DICIEMBRE'
  ];

  function formatFechaISO(iso){
    if(!iso) return "";

    const [y,m,d] = iso.split('-');

    return `${d}/${m}/${y}`;
  }

  function mesDeFecha(iso){
    if(!iso) return "";

    const m = Number(
      iso.split('-')[1]
    );

    return MESES_ES[m-1] || "";
  }

  // ---------- EXPORT ----------
  function buildRows(){
    const list =
      getFiltered().length
        ? getFiltered()
        : obras;

    return list.map(o => ({
      "POBLACION": o.poblacion || "",
      "GESCAL26": o.gescal26 || "",
      "DIRECCION": o.direccion || "",
      "% CONSTRUCCION":
        o.pct != null
          ? `${o.pct}%`
          : "",
      "MES FECHA PROXIMO REPLANTEO":
        mesDeFecha(o.fechaReplanteo),
      "FECHA PROXIMO REPLANTEO":
        formatFechaISO(o.fechaReplanteo),
      "ENTREGA DE LLAVES":
        o.entregaLlaves || "",
      "PROMOTOR":
        o.promotor || "",
      "LINK DE GOOGLE":
        `${o.lat}, ${o.lon}`,
      "CONTACTO":
        o.contacto || "",
      "OBSERVACIONES":
        o.observaciones || "",
      "ESTADO":
        o.estado === "DESCARTADA"
          ? "SIN PERMISO"
          : (o.estado || ""),
      "FECHA DE ULTIMA VISITA":
        o.fechaVisita
          ? formatFechaISO(o.fechaVisita)
          : (
            o.creado
              ? new Date(o.creado).toLocaleDateString('es-ES')
              : ""
          ),
      "TECNICO/S":
        o.tecnico || ""
    }));
  }

  $('export-btn').addEventListener('click', () => {
    const rows = buildRows();

    const ws =
      XLSX.utils.json_to_sheet(rows);

    ws['!cols'] = [
      {wch:16},
      {wch:14},
      {wch:34},
      {wch:12},
      {wch:14},
      {wch:14},
      {wch:14},
      {wch:18},
      {wch:26},
      {wch:14},
      {wch:34},
      {wch:14},
      {wch:16},
      {wch:16}
    ];

    const wb =
      XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      "OBRAS DETECTADAS"
    );

    const stamp =
      new Date()
        .toISOString()
        .slice(0,10);

    const quien =
      (
        techName ||
        $('tech-name-input').value.trim() ||
        'sin nombre'
      )
      .replace(/[\\/:*?"<>|]/g, '')
      .trim();

    XLSX.writeFile(
      wb,
      `Control de Prioritarias ${stamp} ${quien}.xlsx`
    );
  });

  // ---------- INIT ----------
  (function init(){
    loadTechName();

    renderAll();

    startRealtimeSync();
  })();

})();
</script>
</body>
</html>
